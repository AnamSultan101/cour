<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cour Tracker</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;padding:0;background:#05100a}</style>
</head>
<body>
<div id="app">
<style>
  #app{--bg:#05100a;--panel:#0a1a10;--ink:#9ef7b0;--muted:#4f9c68;--accent:#35ff86;--line:#17452a;--r:3px;--font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow:none}
  #app[data-theme="night"]{--bg:#0b0e14;--panel:#131824;--ink:#e7ecf5;--muted:#8794ad;--accent:#6ea8fe;--line:#242c3f;--r:8px;--font:system-ui,-apple-system,Segoe UI,sans-serif;--shadow:0 8px 24px rgba(0,0,0,.45)}
  #app[data-theme="kids"]{--bg:#fff6e9;--panel:#fff;--ink:#2f2a3d;--muted:#7c7490;--accent:#ff6b6b;--line:#ffdfc0;--r:14px;--font:ui-rounded,"Segoe UI",system-ui,sans-serif;--shadow:0 6px 0 rgba(255,196,150,.3)}
  #app[data-theme="soft"]{--bg:#17141d;--panel:#211d29;--ink:#ece6f2;--muted:#9a90ab;--accent:#c3a0ff;--line:#312b3d;--r:12px;--font:system-ui,-apple-system,sans-serif;--shadow:0 10px 30px rgba(0,0,0,.35)}
  #app *{box-sizing:border-box}
  #app{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;position:relative;overflow-x:hidden;font-size:14px;line-height:1.5}
  #app[data-theme="crt"]::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(180deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  .bar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;align-items:center}
  .burger{background:none;border:0;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;width:34px}
  .burger i{display:block;height:2px;background:var(--ink);border-radius:2px}
  .burger:hover i{background:var(--accent)}
  .brand{font-weight:700;letter-spacing:.06em;white-space:nowrap;cursor:pointer}
  .brand small{display:block;font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.14em}
  .spacer{flex:1}
  .btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
  .btn.sm{padding:4px 8px;font-size:12px}
  input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font:inherit;font-size:13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .page{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:16px 16px 30px;max-width:1600px;margin:0 auto;align-items:start}
  .page>div{min-width:0;max-width:100%}
  @media(max-width:1040px){.page{grid-template-columns:1fr}}
  h2{font-size:16px;margin:26px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
  h2:first-child{margin-top:0}
  h2 .c{color:var(--muted);font-weight:400;font-size:12px}
  .muted{color:var(--muted)}
  .lsheet{position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);background:var(--panel);border-right:1px solid var(--line);z-index:61;overflow-y:auto;padding:14px}
  .navsec{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:16px 0 6px}
  .navlink{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-radius:var(--r);color:var(--ink);font:inherit;font-size:14px;padding:9px 10px;cursor:pointer;text-align:left}
  .navlink:hover{background:var(--bg)}
  .navlink[aria-current="true"]{background:var(--accent);color:var(--bg);font-weight:700}
  .navlink .n{margin-left:auto;font-size:11px;color:var(--muted)}
  .navlink[aria-current="true"] .n{color:var(--bg);opacity:.75}
  .fr{position:relative;overflow:hidden;background:var(--panel)}
  .fr>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
  .fr.r169{aspect-ratio:16/9}
  .topband{max-width:1600px;margin:0 auto;padding:16px 16px 0}
  .hero{position:relative;height:clamp(280px,34vw,440px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .hgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.65) 45%,rgba(0,0,0,.1))}
  .hbody{position:absolute;inset:0;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;max-width:640px;color:#fff}
  .hkick{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:6px}
  .htitle{font-size:clamp(22px,3.6vw,36px);font-weight:800;line-height:1.15;margin-bottom:8px}
  .hmeta{font-size:12px;opacity:.85;margin-bottom:10px}
  .dots{position:absolute;bottom:12px;right:16px;display:flex;gap:6px}
  .dot{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);border:0;cursor:pointer;padding:0}
  .dot[aria-current="true"]{background:var(--accent);width:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
  .striprow{position:relative;padding-top:28px;max-width:100%}
  .strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;flex:1;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
  .strip::-webkit-scrollbar{display:none}
  .sarr{position:absolute;top:0;background:transparent;border:0;color:var(--ink);width:24px;height:22px;cursor:pointer;font:inherit;font-size:20px;line-height:1;z-index:2;opacity:.7}
  .sarr:first-child{left:0}.sarr:last-child{right:0}
  .sarr:hover{border-color:var(--accent);color:var(--accent)}
  .sites{display:flex;flex-wrap:wrap;gap:6px}
  .site{border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--ink);border-left-width:3px}
  .site:hover{border-color:var(--accent)}
  .hero{cursor:grab;touch-action:pan-y;transition:transform .22s ease-out}
  .hero.drag{cursor:grabbing;transition:none}
  .strip .card{flex:none;width:212px}
  .card{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;display:block;width:100%}
  .card .fr{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
  .card:hover .fr{border-color:var(--accent)}
  .card:focus-visible .fr{outline:2px solid var(--accent);outline-offset:2px}
  .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:.1em}
  .bdg{position:absolute;font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.78);color:#fff;line-height:1.5;z-index:2}
  .bdg.tl{top:6px;left:6px;background:var(--accent);color:#000}
  .bdg.tr{top:6px;right:6px}
  .bdg.bl{bottom:6px;left:6px}
  .bdg.br{bottom:6px;right:6px}
  .ct{font-weight:700;font-size:13px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cm{font-size:11px;color:var(--muted);margin-top:2px}
  .cn{font-size:11px;color:var(--accent);margin-top:2px;font-weight:700}
  .side{position:sticky;top:64px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .side h3{margin:0 0 4px;font-size:17px;font-weight:800}
  .side .sh{font-size:11px;color:var(--muted);margin-bottom:10px}
  .segs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .seg{border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
  .seg[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
  .rk{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:var(--ink)}
  .rk:last-child{border-bottom:0}
  .rk .no{width:26px;text-align:center;font-weight:800;color:var(--muted);font-size:21px;flex:none}
  .rk.top .no{color:var(--accent)}
  .rk .fr{width:76px;height:44px;border-radius:2px;flex:none}
  .rk .tx{flex:1;min-width:0}
  .rk .tx b{display:block;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rk .tx span{font-size:11px;color:var(--muted)}
  .rk .sc{font-weight:800;color:var(--accent);font-size:15px;flex:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:10px;max-width:100%}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
  .stat b{display:block;font-size:21px;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted)}
  .alert{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .alert .m{font-size:12px;color:var(--muted);flex:1;min-width:160px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:61;overflow-y:auto;padding:16px 16px 60px}
  .modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .sheet h3,.modal h3{margin:0 0 14px;font-size:16px}
  .f{margin-bottom:11px}
  .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .box{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:var(--panel)}
  .box h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:400}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 10px;font-size:11px;cursor:pointer;color:var(--muted)}
  .tag[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
  .ehero{position:relative;height:clamp(190px,26vw,300px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
  .ehero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .ent{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel);flex-wrap:wrap}
  .ent .lab{width:120px;flex:none;font-weight:700;font-size:13px}
  .ent .prog{flex:1;min-width:120px}
  .pbar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .pbar2 i{display:block;height:100%;background:var(--accent)}
  .ent .num{font-size:11px;color:var(--muted);margin-top:4px}
  .ent.done{opacity:.72}
  .triage{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:14px;overflow-y:auto}
  .tcard{max-width:780px;margin:0 auto;width:100%;text-align:center}
  .thero{width:min(400px,100%);margin:10px auto}
  .thero .fr{border-radius:var(--r);border:1px solid var(--line)}
  .big{font-size:clamp(19px,4.6vw,27px);font-weight:800;margin-bottom:4px}
  .ask{font-size:13px;color:var(--muted);margin:10px 0}
  .now{font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:9px 12px;display:inline-block;margin-bottom:4px}
  .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
  .acts .btn{padding:14px 10px;font-size:14px}
  .pbar{height:4px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:10px}
  .pbar i{display:block;height:100%;background:var(--accent)}
  .disc{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--panel)}
  .disc .sc{font-size:20px;font-weight:800;color:var(--accent)}
  .li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-weight:700;z-index:90;font-size:13px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:100%}
  @media(max-width:760px){.week{grid-template-columns:repeat(3,1fr)}}
  .day{position:relative;border:0;border-radius:0;padding:18px 12px;min-height:116px;background-color:var(--panel);background-position:center;background-size:cover;cursor:pointer;overflow:hidden;text-align:left;color:var(--ink)}
  .day::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,16,10,.25),rgba(5,16,10,.9))}
  .day>*{position:relative}
  .day b{font-size:clamp(16px,2.8vw,30px);letter-spacing:.04em;color:#fff;display:block;margin-top:34px;text-align:center}
  .day.today b,.day.selected b{color:var(--accent)}
  .day.selected{box-shadow:inset 0 -3px 0 var(--accent)}
  .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .col h3{font-size:13px;margin:0 0 8px;font-weight:700}
  .mini{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:var(--ink)}
  .mini .fr{width:60px;height:34px;border-radius:2px;flex:none}
  .mini b{display:block;font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mini span{font-size:10px;color:var(--muted)}
  .foot{position:relative;margin-top:30px;border-top:1px solid var(--line);overflow:hidden}
  .foot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.25}
  .footveil{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),rgba(0,0,0,.2))}
  .footin{position:relative}
  .footcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;padding:26px 16px;max-width:1600px;margin:0 auto}
  .footcols h4{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:400}
  .flist{display:flex;flex-direction:column;gap:6px}
  .flink{background:none;border:0;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;padding:2px 0;display:flex;gap:8px}
  .flink:hover{color:var(--accent)}
  .flink .n{margin-left:auto;color:var(--muted);font-size:11px}
  .credit{position:relative;border-top:1px solid var(--line);padding:14px 16px;font-size:11px;color:var(--muted);text-align:center}
</style>

<div class="bar">
  <button class="burger" onclick="openNav()" aria-label="Menu"><i></i><i></i><i></i></button>
  <div class="brand" onclick="go('dash')">COUR TRACKER<small id="sub">READY.</small></div>
  <div class="spacer"></div>
  <input id="q" placeholder="Search" style="max-width:150px" oninput="render()">
  <button class="btn" onclick="openThemes()">Theme</button>
  <button class="btn pri" onclick="openEdit(null)">Add</button>
</div>
<div id="top"></div>
<div class="page"><div id="view"></div><div id="side"></div></div>
<div id="foot"></div>
<div id="layer"></div>
</div>

<script>
(function(){
const KEY='cour.v6', OLDKEYS=['cour.v5','cour.v4','cour.v3'];
const VER='v17';
const CATS=['Isekai','Action','Adventure','Shounen','Drama','Mystery','Comedy','Shoujo','BL','Slice of Life','Sports','Fantasy','Sci-Fi','Horror','Historical','Romance','Psychological','Iyashikei','Thriller','Supernatural'];
const INTENT=[['','Undecided'],['active','Following'],['later','Watch later'],['treasure','Treasure'],['might','Might watch'],['dropped','Dropped'],['notmine','Not my thing']];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SITES=[
  {n:'anikoto',u:'https://anikoto.cz/search?keyword={q}',c:'#3aa0ff'},
  {n:'animepahe',u:'https://animepahe.ru/search?q={q}',c:'#f2a341'},
  {n:'9anime',u:'https://9animetv.to/search?keyword={q}',c:'#8b5cf6'},
  {n:'animesuge',u:'https://animesuge.bz/search?keyword={q}',c:'#e2444a'},
  {n:'everythingmoe',u:'https://everythingmoe.com/?s={q}',c:'#22c39a'}
];
const STORE=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:{
  get:async k=>{const v=localStorage.getItem(k);return v?{key:k,value:v}:null;},
  set:async (k,v)=>{localStorage.setItem(k,v);return{key:k,value:v};}
};
let DB={franchises:[],lists:[],discover:[],prefs:{theme:'crt',accents:{},rank:'overall',covers:{},watchBase:'https://anikoto.cz/search?keyword={q}'}};
let TAB='dash',TABBACK='dash',LIST=null,ENT=null,GENRE='',RECGENRE='',WEEKDAY=null,SORT='added',HI=0,heroTimer=null,SYNCING=false;

const $=i=>document.getElementById(i);
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

/* ---------- storage + migration ---------- */
function migrate(old){
  const map={completed:'active',watching:'active',caught:'active',planned:'later',treasure:'treasure',dropped:'dropped',meh:'might',unsorted:''};
  DB.franchises=(old.shows||[]).map(s=>{
    const movie=(s.format==='MOVIE');
    const total=s.episodes||(movie?1:null);
    const aired=s.airingEpisode||((s.airStatus==='finished')?total:0);
    return {id:s.id||uid(),title:s.title,englishTitle:s.englishTitle||'',studio:s.studio||'',year:s.year||null,
      genres:(s.categories||[]).slice(),score:s.score!=null?s.score:null,rating:s.rating!=null?s.rating:null,
      review:s.review||'',favorite:!!s.favorite,blurb:s.blurb||'',cover:s.cover||'',banner:s.banner||'',
      intent:map[s.myStatus]!==undefined?map[s.myStatus]:'',notes:'',rewatches:0,droppedAt:null,skipped:!!s.skipped,
      entries:[{id:uid(),label:movie?'Movie':'Season 1',order:1,type:movie?'movie':'tv',
        episodes:total,aired:aired||0,status:(!s.airStatus||s.airStatus==='unknown')?'finished':s.airStatus,
        watched:s.currentEpisode||0,nextDate:s.nextAirDate||''}]};
  });
  if(old.lists)DB.lists=old.lists;
  if(old.prefs)DB.prefs=Object.assign({},DB.prefs,old.prefs);
}
async function load(){
  let raw=null;
  try{const r=await STORE.get(KEY);if(r&&r.value)raw=r.value;}catch(e){}
  if(raw){try{DB=Object.assign(DB,JSON.parse(raw));}catch(e){}}
  if(!DB.franchises.length){
    for(const k of OLDKEYS){
      try{const r=await STORE.get(k);
        if(r&&r.value){const d=JSON.parse(r.value);if(d.shows&&d.shows.length){migrate(d);save();break;}}
      }catch(e){}
    }
  }
  DB.prefs=DB.prefs||{};DB.prefs.covers=DB.prefs.covers||{};DB.prefs.accents=DB.prefs.accents||{};
  DB.lists=DB.lists||[];DB.discover=DB.discover||[];

/* ---------- derivation ---------- */
function ordered(f){return (f.entries||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));}
function available(e){
  if(e.status==='announced')return 0;
  if(e.status==='airing')return e.aired||0;
  return e.episodes||e.aired||0;
}
function entryBacklog(e){return Math.max(0,available(e)-(e.watched||0));}
function backlog(f){return ordered(f).reduce((n,e)=>n+entryBacklog(e),0);}
function watchedTotal(f){return ordered(f).reduce((n,e)=>n+(e.watched||0),0);}
function seasonsBehind(f){return ordered(f).filter(e=>available(e)>0&&(e.watched||0)===0).length;}
function isOngoing(f){return ordered(f).some(e=>e.status==='airing'||e.status==='announced');}
function airingEntry(f){return ordered(f).find(e=>e.status==='airing')||null;}
function announcedEntry(f){return ordered(f).find(e=>e.status==='announced')||null;}
function nextUpEntry(f){return ordered(f).find(e=>entryBacklog(e)>0)||null;}
function state(f){
  if(f.intent==='dropped')return 'dropped';
  if(f.intent==='notmine')return 'notmine';
  const b=backlog(f), w=watchedTotal(f);
  if(w===0&&b>0)return 'notstarted';
  if(b===0){
    if(airingEntry(f))return 'caught';
    if(announcedEntry(f))return 'caught';
    if(f.more)return 'ongoing';
    return 'completed';
  }
  return seasonsBehind(f)>=1?'seasonbehind':'watching';
}
const STATELABEL={notstarted:'Not started',watching:'Watching',caught:'Caught up',between:'Between seasons',ongoing:'Ongoing',seasonbehind:'Season behind',completed:'Completed',dropped:'Dropped',notmine:'Not my thing'};
function stateLine(f){
  const st=state(f), b=backlog(f), e=nextUpEntry(f);
  if(st==='watching')return `${b} episode${b===1?'':'s'} waiting`;
  if(st==='seasonbehind'){const n=seasonsBehind(f);return `${n} season${n===1?'':'s'} behind`;}
  if(st==='caught'){
    const next=announcedEntry(f);
    if(next){const d=next.nextDate?daysTo(next.nextDate):null;return d!=null&&d>=0?`${next.label} in ${d}d`:'Next season announced';}
    const a=airingEntry(f);
    if(a&&a.nextDate){const d=daysTo(a.nextDate);if(d!=null&&d>=0)return d===0?'New episode today':`Next episode in ${d}d`;}
    return 'Caught up — waiting';
  }
  if(st==='between'){const a=announcedEntry(f);const d=a&&a.nextDate?daysTo(a.nextDate):null;
    return d!=null&&d>=0?`${a.label} in ${d}d`:'Next season announced';}
  if(st==='ongoing')return 'Caught up — story continues';
  if(st==='completed')return f.rewatches?`Finished · ${f.rewatches} rewatch${f.rewatches===1?'':'es'}`:'Finished';
  if(st==='notstarted')return e?`Start at ${e.label}`:'Not started';
  if(st==='dropped')return f.droppedAt?`Dropped at ${f.droppedAt}`:'Dropped';
  return STATELABEL[st]||'';
}

function bindSwipe(){
  const el=$('top');if(!el)return;
  const h=el.querySelector('.hero');if(!h)return;
  let x0=null,dragging=false;
  const start=function(e){x0=e.clientX;dragging=true;h.setPointerCapture(e.pointerId);h.classList.add('drag');};
  const move=function(e){
    if(!dragging)return;
    const dx=e.clientX-x0;
    h.style.transform='translateX('+Math.max(-90,Math.min(90,dx*0.35))+'px)';
  };
  const end=function(e){
    if(!dragging)return;
    dragging=false;h.classList.remove('drag');h.style.transform='';
    const dx=e.clientX-x0;x0=null;
    if(Math.abs(dx)>60)stepHero(dx<0?1:-1);
  };
  h.addEventListener('pointerdown',function(e){e.preventDefault();start(e);});
  h.addEventListener('pointermove',move);
  h.addEventListener('pointerup',end);
  h.addEventListener('pointercancel',end);
}

    .sort(function(a,b){return ((b.f.score||0)+b.fit*0.8)-((a.f.score||0)+a.fit*0.8);}).slice(0,6);

    <div class="col"><h3>Might be worth it <span class="muted" style="font-weight:400">7+</span></h3>${
      (function(){
        const sug=(DB.suggestions||[]).filter(function(s){return (s.score||0)>=7&&(!recGenre||(s.genres||[]).indexOf(recGenre)>=0);})
          .map(function(s){return {s:s,fit:(s.genres||[]).filter(function(g){return fav.indexOf(g)>=0;}).length};})
          .sort(function(a,b){return ((b.s.score||0)+b.fit*0.8)-((a.s.score||0)+a.fit*0.8);}).slice(0,6);
        if(sug.length)return sug.slice(0,3).map(function(o){
          const st=o.s.status==='announced'?'upcoming':'airing';
          return `<button class="mini" onclick="addSuggestion('${esc(o.s.title)}')">
            <div class="fr r169" style="width:60px;height:34px;border-radius:2px;flex:none">${o.s.cover?`<img src="${esc(o.s.cover)}" alt="">`:''}</div>
            <div style="flex:1;min-width:0"><b>${esc(o.s.title)}</b>
              <span>${o.s.score} · ${st}${o.s.nextDate?' · '+esc(o.s.nextDate):''}${o.fit?' · your genres':''}</span></div></button>`;
        }).join('');
        return worth.length?worth.slice(0,3).map(function(o){return mini(o.f,`${o.f.score} · ${(o.f.genres||[]).slice(0,2).join(' / ')}${o.fit?' · '+esc(recGenre):''}`);}).join('')
          :'<span class="muted" style="font-size:12px">Run the sync script to pull new shows in your genres.</span>';
      })()
    }</div>
    <div class="col"><h3>From the watchlist</h3>${wl.length?wl.map(f=>mini(f,[f.year,f.studio].filter(Boolean).join(' · '))).join(''):'<span class="muted" style="font-size:12px">Watchlist is empty.</span>'}</div>

function dash(){
  const w=inState('watching'), ne=newEpisodes(), und=undecided();
  let h=`<div class="stats">
    <div class="stat"><b>${DB.franchises.length}</b><span>library</span></div>

    <div class="stat"><b>${inState('seasonbehind').length}</b><span>seasons behind</span></div>
    <div class="stat"><b>${inState('completed').length}</b><span>completed</span></div>
    <div class="stat"><b>${und.length}</b><span>undecided</span></div></div>`;
  ne.slice(0,4).forEach(f=>{const b=backlog(f),a=airingEntry(f);
    h+=`<div class="alert"><b>${esc(f.title)}</b><span class="m">${b} new episode${b===1?'':'s'} out${a&&a.nextDate?' · next '+esc(a.nextDate):''}</span>

  h+=`<div class="alert"><b>Airing data out of date?</b><span class="m">Run sync-anime.mjs on your PC and paste the result — it pulls real seasons, air dates and what's running now.</span><button class="btn pri" onclick="openSyncImport()">Import sync file</button><button class="btn" onclick="openAiring()">Or fix by hand</button></div>`;
  h+=onAirStrip();

  const c=inState('caught').concat(inState('between'));

function sortList(l){
  const c=l.slice();
  if(SORT==='title')c.sort((a,b)=>a.title.localeCompare(b.title));
  else if(SORT==='year')c.sort((a,b)=>(b.year||0)-(a.year||0));
  else if(SORT==='score')c.sort((a,b)=>(score(b)||0)-(score(a)||0));
  else if(SORT==='backlog')c.sort((a,b)=>backlog(b)-backlog(a));
  return c;
}

const CLOUDKEY='cour.cloud';
let CLOUD={url:'',key:'',token:'',refresh:'',uid:'',email:''};
function loadCloud(){
  try{const raw=localStorage.getItem(CLOUDKEY);if(raw)CLOUD=Object.assign(CLOUD,JSON.parse(raw));}catch(e){}
}
function saveCloud(){try{localStorage.setItem(CLOUDKEY,JSON.stringify(CLOUD));}catch(e){}}
function cloudOn(){return !!(CLOUD.url&&CLOUD.key);}
function signedIn(){return !!(cloudOn()&&CLOUD.token&&CLOUD.uid);}
function cloudHeaders(auth){
  const hd={'Content-Type':'application/json','apikey':CLOUD.key};
  if(auth&&CLOUD.token)hd['Authorization']='Bearer '+CLOUD.token;
  return hd;
}
async function authCall(path,body){
  const r=await fetch(CLOUD.url.replace(/\/$/,'')+'/auth/v1/'+path,{method:'POST',headers:cloudHeaders(false),body:JSON.stringify(body)});
  const d=await r.json().catch(function(){return {};});
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return d;
}
function keepSession(d){
  if(d.access_token){CLOUD.token=d.access_token;CLOUD.refresh=d.refresh_token||CLOUD.refresh;}
  const u=d.user||(d.session&&d.session.user);
  if(u){CLOUD.uid=u.id;CLOUD.email=u.email||CLOUD.email;}
  saveCloud();
}
window.cloudSignIn=async function(mode){
  const url=($('cb_url').value||'').trim(), key=($('cb_key').value||'').trim();
  const email=($('cb_email').value||'').trim(), pass=$('cb_pass').value||'';
  if(!url||!key)return cloudMsg('Paste the project URL and the anon key first.');
  if(!email||!pass)return cloudMsg('Email and password needed.');
  CLOUD.url=url;CLOUD.key=key;saveCloud();
  cloudMsg('Working…');
  try{
    if(mode==='up'){
      const d=await authCall('signup',{email:email,password:pass});
      keepSession(d);
      if(!CLOUD.token)return cloudMsg('Account made. Check your email to confirm, then sign in.');
    }else{
      const d=await authCall('token?grant_type=password',{email:email,password:pass});
      keepSession(d);
    }
    cloudMsg('Signed in as '+CLOUD.email);
    await cloudPull(true);
  }catch(e){cloudMsg('Failed: '+e.message);}
};
window.cloudSignOut=function(){
  CLOUD.token='';CLOUD.refresh='';CLOUD.uid='';CLOUD.email='';saveCloud();
  cloudMsg('Signed out. Your library stays on this device.');
};
async function refreshToken(){
  if(!CLOUD.refresh)return false;
  try{const d=await authCall('token?grant_type=refresh_token',{refresh_token:CLOUD.refresh});keepSession(d);return !!CLOUD.token;}
  catch(e){return false;}
}
async function cloudPush(quiet){
  if(!signedIn())return;
  const body=[{user_id:CLOUD.uid,data:DB,updated_at:new Date().toISOString()}];
  const url=CLOUD.url.replace(/\/$/,'')+'/rest/v1/library?on_conflict=user_id';
  let r=await fetch(url,{method:'POST',headers:Object.assign(cloudHeaders(true),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});
  if(r.status===401&&await refreshToken()){
    r=await fetch(url,{method:'POST',headers:Object.assign(cloudHeaders(true),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});
  }
  if(!r.ok){if(!quiet)toast('Cloud save failed ('+r.status+')');return;}
  DB.prefs.cloudAt=Date.now();
  if(!quiet)toast('Saved to cloud');
}
async function cloudPull(quiet){
  if(!signedIn())return;
  const url=CLOUD.url.replace(/\/$/,'')+'/rest/v1/library?select=data,updated_at&user_id=eq.'+CLOUD.uid;
  let r=await fetch(url,{headers:cloudHeaders(true)});
  if(r.status===401&&await refreshToken())r=await fetch(url,{headers:cloudHeaders(true)});
  if(!r.ok){if(!quiet)toast('Cloud read failed ('+r.status+')');return;}
  const rows=await r.json().catch(function(){return [];});
  if(!rows.length){await cloudPush(true);if(!quiet)toast('Uploaded this device\'s library');return;}
  const remote=rows[0], rAt=new Date(remote.updated_at).getTime();
  const localAt=DB.prefs.savedAt||0;
  if(rAt>localAt+2000&&remote.data&&remote.data.franchises){
    layer(`<div class="modal" onclick="event.stopPropagation()"><h3>Newer copy in the cloud</h3>
      <p class="muted" style="font-size:13px">The cloud copy has ${remote.data.franchises.length} shows and was saved ${new Date(rAt).toLocaleString()}.
      This device has ${DB.franchises.length} shows.</p>
      <div class="row"><button class="btn pri" onclick="adoptCloud()">Use the cloud copy</button>
      <button class="btn" onclick="closeLayer();cloudPush()">Keep this device and overwrite</button></div></div>`);
    PENDING=remote.data;
    return;
  }
  await cloudPush(true);
  if(!quiet)toast('Cloud is up to date');
}

/* ---------- live sync (works on any real https page) ---------- */
const SYNC_FIELDS=`id title{romaji english} status episodes format
  nextAiringEpisode{episode airingAt}
  coverImage{extraLarge} bannerImage averageScore genres seasonYear
  studios(isMain:true){nodes{name}} description(asHtml:false)
  relations{edges{relationType node{title{romaji english} status episodes format startDate{year month day}}}}`;
function dateOf(d){return (d&&d.year)?`${d.year}-${String(d.month||1).padStart(2,'0')}-${String(d.day||1).padStart(2,'0')}`:'';}
async function gql(query,variables){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({query:query,variables:variables})});
  if(r.status===429){await new Promise(function(z){setTimeout(z,5000);});return gql(query,variables);}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const b=await r.json();
  if(!b.data)throw new Error('no data');
  return b.data;
}
function aliveOnes(){
  return DB.franchises.filter(function(f){
    if(['dropped','notmine'].indexOf(f.intent)>=0)return false;
    const st=state(f);
    return airingEntry(f)||announcedEntry(f)||f.more||['watching','caught','between','ongoing'].indexOf(st)>=0;
  }).slice(0,60);
}
function artworkPool(){
  return DB.franchises.filter(function(f){
    return ['dropped','notmine'].indexOf(f.intent)<0 && !art(f);
  });
}
function livePool(){
  return DB.franchises.filter(function(f){
    return ['dropped','notmine'].indexOf(f.intent)<0;
  });
}
function applyLive(f,list){
  if(!list||!list.length)return false;
  const primary=list[0], releasing=primary.status==='RELEASING'?primary:null;
  if(!f.cover&&primary.coverImage&&primary.coverImage.extraLarge)f.cover=primary.coverImage.extraLarge;
  if(!f.banner&&primary.bannerImage)f.banner=primary.bannerImage;
  if(f.score==null&&primary.averageScore)f.score=Math.round(primary.averageScore)/10;
  if(!f.studio&&primary.studios&&primary.studios.nodes[0])f.studio=primary.studios.nodes[0].name;
  if(!f.year&&primary.seasonYear)f.year=primary.seasonYear;
  if(!f.blurb&&primary.description)f.blurb=primary.description.replace(/<[^>]+>/g,'').slice(0,220);
  if(!f.englishTitle&&primary.title&&primary.title.english)f.englishTitle=primary.title.english;
  const es=ordered(f);
  if(releasing){
    let e=airingEntry(f)||es[es.length-1];
    if(!e){e={id:uid(),label:'Season 1',order:1,type:'tv',watched:0};f.entries=[e];}
    e.status='airing';
    const nx=releasing.nextAiringEpisode;
    e.aired=nx?Math.max(0,nx.episode-1):(releasing.episodes||e.aired||0);
    if(releasing.episodes)e.episodes=releasing.episodes;
    if(nx){e.nextDate=new Date(nx.airingAt*1000).toISOString().slice(0,10);e.weekday=new Date(nx.airingAt*1000).getDay();}
  }else{
    es.forEach(function(e){if(e.status==='airing'){e.status='finished';e.nextDate='';if(!e.episodes)e.episodes=e.aired;}});
  }
  const seq=(primary.relations&&primary.relations.edges||[]).filter(function(x){
    return x.relationType==='SEQUEL'&&x.node&&x.node.status==='NOT_YET_RELEASED';})[0];
  if(seq){
    const label=seq.node.title.english||seq.node.title.romaji;
    if(!ordered(f).some(function(e){return e.label===label;})){
      f.entries.push({id:uid(),label:label,order:f.entries.length+1,type:'tv',
        episodes:seq.node.episodes||null,aired:0,status:'announced',watched:0,nextDate:dateOf(seq.node.startDate)});
    }
    f.more=true;
  }
  return true;
}
async function pullFeed(){
  const r=await fetch('data/anime.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('no feed');
  return await r.json();
}
function applyFeed(feed){
  const idx=new Map();
  DB.franchises.forEach(function(f){
    idx.set(norm(f.title),f);
    if(f.englishTitle)idx.set(norm(f.englishTitle),f);
  });
  const dist=function(a,b){
    if(Math.abs(a.length-b.length)>2)return 99;
    const m=a.length,n=b.length,prev=[],cur=[];
    for(let j=0;j<=n;j++)prev[j]=j;
    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      }
      for(let j=0;j<=n;j++)prev[j]=cur[j];
    }
    return prev[n];
  };
  const resolve=function(m){
    const keys=[m.title,m.english,m.native].filter(Boolean).map(norm);
    for(const k of keys){if(idx.has(k))return idx.get(k);}
    let best=null,bl=0;
    DB.franchises.forEach(function(f){
      [f.title,f.englishTitle].filter(Boolean).forEach(function(nm){
        const n2=norm(nm);if(n2.length<6)return;
        keys.forEach(function(k){
          if((k.indexOf(n2)===0||n2.indexOf(k)===0)&&n2.length>bl){best=f;bl=n2.length;}
        });
      });
    });
    if(best)return best;
    // last resort: a typo or two apart, on long titles only
    let fuzzy=null,fd=3;
    DB.franchises.forEach(function(f){
      [f.title,f.englishTitle].filter(Boolean).forEach(function(nm){
        const n2=norm(nm);if(n2.length<10)return;
        keys.forEach(function(k){
          if(k.length<10)return;
          const d=dist(k,n2);
          if(d<fd){fd=d;fuzzy=f;}
        });
      });
    });
    return fuzzy;
  };
  let touched=0;
  const currentAiring=new Set();
  (feed.shows||[]).forEach(function(m){
    const f=resolve(m);
    if(!f)return;
    if(!f.cover&&m.cover)f.cover=m.cover;
    if(!f.banner&&m.banner)f.banner=m.banner;
    if(f.score==null&&m.score)f.score=m.score;
    if(!f.studio&&m.studio)f.studio=m.studio;
    if(!f.year&&m.year)f.year=m.year;
    if(!f.blurb&&m.blurb)f.blurb=m.blurb;
    if(!f.englishTitle&&m.english)f.englishTitle=m.english;
    const es=ordered(f);
    if(m.status==='airing'){
      currentAiring.add(f.id);
      let e=airingEntry(f)||es[es.length-1];
      if(!e){e={id:uid(),label:'Season 1',order:1,type:'tv',watched:0};f.entries=[e];}
      e.status='airing';
      if(m.aired!=null)e.aired=m.aired;
      if(m.episodes)e.episodes=m.episodes;
      if(m.nextDate)e.nextDate=m.nextDate;
      if(m.weekday!=null)e.weekday=m.weekday;
    }
    if(m.sequel){
      const lbl=m.sequel.title;
      if(!es.some(function(e){return e.label===lbl;})){
        f.entries.push({id:uid(),label:lbl,order:f.entries.length+1,type:'tv',
          episodes:m.sequel.episodes||null,aired:0,status:'announced',watched:0,nextDate:m.sequel.date||''});
      }
      f.more=true;
    }
    touched++;
  });
  DB.franchises.forEach(function(f){
    if(currentAiring.has(f.id))return;
    (f.entries||[]).forEach(function(e){
      if(e.status==='airing'){e.status='finished';e.nextDate='';if(!e.episodes)e.episodes=e.aired;}
    });
  });
  // anything in the feed you don't own, scoring 7+, becomes a discovery candidate
  const owned=new Set(DB.franchises.map(function(f){return norm(f.title);}));
  const skipped=new Set((DB.discover||[]).filter(function(x){return x.skipped;}).map(function(x){return norm(x.title);}));
  const fav=favGenres();
  DB.discover=(feed.shows||[])
    .filter(function(m){
      const k=norm(m.english||m.title);
      return (m.score||0)>=7 && !owned.has(k) && !owned.has(norm(m.title)) && !skipped.has(k);})
    .map(function(m){return {title:m.english||m.title,score:m.score,genres:m.genres||[],year:m.year,
      studio:m.studio||'',status:m.status,date:m.nextDate||m.start||'',image:m.banner||m.cover||'',blurb:m.blurb||''};})
    .sort(function(a,b){
      const fa=(a.genres||[]).filter(function(g){return fav.indexOf(g)>=0;}).length;
      const fb=(b.genres||[]).filter(function(g){return fav.indexOf(g)>=0;}).length;
      return ((b.score||0)+fb*0.8)-((a.score||0)+fa*0.8);})
    .slice(0,40);
  DB.prefs.lastSync=Date.now();
  DB.prefs.feedAt=feed.generated||'';
  DB.prefs.airingVerified=true;
  save();
  return touched;
}

window.syncLive=async function(quiet, missingArtOnly){
  if(SYNCING)return;SYNCING=true;
  const pool=missingArtOnly?artworkPool():livePool();
  if(!pool.length){SYNCING=false;return;}
  if(!quiet)toast('Checking '+pool.length+' shows for artwork…');
  let ok=0,fail=0;
  try{
    for(let i=0;i<pool.length;i+=6){
      const batch=pool.slice(i,i+6);
      const vars={},parts=[];
      batch.forEach(function(f,j){
        vars['s'+j]=f.englishTitle||f.title;
        parts.push(`a${j}:Page(perPage:4){media(search:$s${j},type:ANIME,sort:[SEARCH_MATCH]){${SYNC_FIELDS}}}`);
      });
      const q='query('+batch.map(function(f,j){return '$s'+j+':String';}).join(',')+'){'+parts.join(' ')+'}';
      let data;
      try{data=await gql(q,vars);}
      catch(err){fail++;if(fail>2)throw err;continue;}
      batch.forEach(function(f,j){
        const page=data['a'+j];
        if(page&&page.media&&applyLive(f,page.media))ok++;
      });
      save();
      await new Promise(function(z){setTimeout(z,800);});
    }
    await syncDiscover();
    DB.prefs.lastSync=Date.now();
    DB.prefs.airingVerified=true;
    save();render();
    if(!quiet)toast(ok+' shows refreshed');
  }catch(err){
    if(!quiet)toast('Cannot reach AniList from here — this needs the hosted version');
  }
  SYNCING=false;
};
async function syncDiscover(){
  const fav=favGenres();
  const genres=(fav.length?fav:['Fantasy','Action','Adventure']).slice(0,4);
  const y=new Date().getFullYear();
  const q=`query($g:[String],$y:Int){Page(perPage:30){media(type:ANIME,sort:[SCORE_DESC],averageScore_greater:70,
    genre_in:$g,seasonYear:$y,isAdult:false,format_in:[TV,TV_SHORT,MOVIE]){
    title{romaji english} averageScore genres seasonYear status startDate{year month day}
    studios(isMain:true){nodes{name}} description(asHtml:false) coverImage{extraLarge} bannerImage}}}`;
  try{
    const d=await gql(q,{g:genres,y:y});
    const owned=new Set(DB.franchises.map(function(f){return norm(f.title);}));
    const seen=new Set((DB.discover||[]).filter(function(x){return x.skipped;}).map(function(x){return norm(x.title);}));
    DB.discover=(d.Page.media||[]).map(function(m){
      const t=m.title.english||m.title.romaji;
      return {title:t,score:m.averageScore?Math.round(m.averageScore)/10:null,genres:m.genres||[],
        year:m.seasonYear||y,studio:(m.studios&&m.studios.nodes[0]&&m.studios.nodes[0].name)||'',
        status:m.status==='RELEASING'?'airing':(m.status==='NOT_YET_RELEASED'?'announced':'finished'),
        date:dateOf(m.startDate),image:m.bannerImage||(m.coverImage&&m.coverImage.extraLarge)||'',
        blurb:(m.description||'').replace(/<[^>]+>/g,'').slice(0,180)};
    }).filter(function(x){return !owned.has(norm(x.title))&&!seen.has(norm(x.title));});
  }catch(e){}
}
function syncAge(){
  if(!DB.prefs.lastSync)return 'never';
  const m=Math.round((Date.now()-DB.prefs.lastSync)/60000);
  if(m<2)return 'just now';
  if(m<60)return m+' min ago';
  const hrs=Math.round(m/60);
  return hrs<48?hrs+'h ago':Math.round(hrs/24)+'d ago';
}
function autoSync(){
  if(location.protocol!=='http:'&&location.protocol!=='https:')return;
  const last=DB.prefs.lastSync||0;
  if(Date.now()-last<6*3600*1000)return;
  setTimeout(function(){syncNow(true);},1500);
}

const CATMAP={'isekai':['Isekai'],'adventureactionshonen':['Action','Adventure','Shounen'],'dramamystery':['Drama','Mystery'],'shoujobl':['Shoujo','BL'],'comedy':['Comedy'],'shounen':['Shounen'],'action':['Action'],'drama':['Drama']};
const NUMPREFIX=/^\s*\d{1,4}\s*[-–—.):]\s*/;
window.doImport=function(){
  const el=$('imp')||$('imp2');if(!el)return;
  const out=[];let cat=[],watch=false;
  el.value.split(/\r?\n/).forEach(raw=>{
    let line=raw.trim();if(!line)return;
    if(!NUMPREFIX.test(line)){
      const k=norm(line.replace(/[:：]$/,''));
      if(/^watch(ing)?list$|^towatch$/.test(k)){watch=true;cat=[];return;}
      if(CATMAP[k]){watch=false;cat=CATMAP[k];return;}
      if(/anime$/.test(k)&&k.length<16)return;
      if(/[:：]$/.test(line)){watch=false;cat=[line.replace(/[:：]$/,'').trim()];return;}
    }
    line=line.replace(NUMPREFIX,'');
    const fav=/[⭐🌟★]/.test(line),no=/[❌✖✗]/.test(line);
    const title=line.replace(/[⭐🌟★❌✖✗✅]/g,'').replace(/\s{2,}/g,' ').trim();
    if(title.length<2)return;
    out.push({title,favorite:fav,genres:cat.slice(),intent:no?'notmine':(watch?'later':'')});
  });
  if(!out.length)return toast('Nothing parsed');
  const seen=new Map(DB.franchises.map(f=>[norm(f.title),f]));let a=0,m=0;
  out.forEach(r=>{const k=norm(r.title);
    if(seen.has(k)){const f=seen.get(k);f.favorite=f.favorite||r.favorite;
      f.genres=Array.from(new Set([].concat(f.genres||[],r.genres)));m++;}
    else{const f={id:uid(),title:r.title,genres:r.genres,favorite:r.favorite,intent:r.intent,
      rating:null,score:null,review:'',rewatches:0,
      entries:[{id:uid(),label:'Season 1',order:1,type:'tv',episodes:null,aired:0,status:'finished',watched:0,nextDate:''}]};
      DB.franchises.push(f);seen.set(k,f);a++;}});
  save();closeLayer();TAB='dash';render();toast(`${a} added${m?', '+m+' merged':''}`);
};

window.runSync=function(){
  let d;
  try{d=JSON.parse(($('syncin').value||'').trim());}catch(e){$('syncout').textContent='That is not valid JSON.';return;}
  if(!d||!d.shows){$('syncout').textContent='No shows in that file.';return;}
  const loose=function(x){return norm(x).replace(/^(the|a)/,'').replace(/(the|a|of|to|in|my)/g,'');};
  const idx=new Map(), loosely=new Map();
  DB.franchises.forEach(function(f){
    [f.title,f.englishTitle].filter(Boolean).forEach(function(t){
      idx.set(norm(t),f);
      if(!loosely.has(loose(t)))loosely.set(loose(t),f);
    });
  });
  const match=function(s){
    const cands=[s.query,s.title,s.english].filter(Boolean);
    for(const c of cands){const f=idx.get(norm(c));if(f)return f;}
    for(const c of cands){const f=loosely.get(loose(c));if(f)return f;}
    for(const c of cands){
      const lc=loose(c);
      if(lc.length<8)continue;
      for(const [k,f] of loosely){
        if(k.length>=8&&(k.indexOf(lc)===0||lc.indexOf(k)===0))return f;
      }
    }
    return null;
  };
  let upd=0,newSeasons=0,unmatched=[];
  d.shows.forEach(function(s){
    const f=match(s);
    if(!f){unmatched.push(s.query||s.title);return;}
    upd++;
    f.aniListId=s.aniListId;
    if(s.english&&!f.englishTitle)f.englishTitle=s.english;
    if(s.cover&&!f.cover)f.cover=s.cover;
    if(s.banner)f.banner=s.banner;
    if(s.score!=null)f.score=s.score;
    if(s.year&&!f.year)f.year=s.year;
    if(s.studio&&!f.studio)f.studio=s.studio;
    if(s.description&&!f.blurb)f.blurb=s.description;
    if(s.genres&&s.genres.length){
      const keep=s.genres.filter(function(g){return CATS.indexOf(g)>=0;});
      f.genres=Array.from(new Set([].concat(f.genres||[],keep)));
    }
    f.more=!!s.more;
    // keep what you've watched; replace the shape of the seasons
    const oldWatched=(f.entries||[]).reduce(function(n,e){return n+(e.watched||0);},0);
    const byId={};(f.entries||[]).forEach(function(e){if(e.aniListId)byId[e.aniListId]=e;});
    const before=(f.entries||[]).length;
    f.entries=s.entries.map(function(e,i){
      const prev=byId[e.aniListId]||(f.entries||[])[i];
      return {id:(prev&&prev.id)||uid(),label:e.label,order:e.order,type:e.type,
        episodes:e.episodes,aired:e.aired,status:e.status,nextDate:e.nextDate||'',
        aniListId:e.aniListId,watched:prev?(prev.watched||0):0};
    });
    if(f.entries.length>before)newSeasons+=f.entries.length-before;
    // a single migrated row carried the whole franchise's progress — spread it forward
    if(before===1&&f.entries.length>1&&oldWatched>0){
      let left=oldWatched;
      f.entries.forEach(function(e){
        const cap=e.status==='announced'?0:(e.aired||e.episodes||0);
        const take=Math.min(cap,left);e.watched=take;left-=take;
      });
    }
  });
  if(d.discover&&d.discover.length){
    DB.suggestions=d.discover;
  }
  save();render();
  $('syncout').innerHTML=`<b style="color:var(--accent)">${upd} shows updated · ${newSeasons} new seasons added · ${(d.discover||[]).length} suggestions.</b>`+
    (unmatched.length?`<br>${unmatched.length} in the file didn't match anything here: ${unmatched.slice(0,6).map(esc).join(', ')}${unmatched.length>6?'…':''}`:'');
};

window.runStatusImport=function(){
  let d;
  try{d=JSON.parse(($('stin').value||'').trim());}catch(e){$('stout').textContent='That is not valid JSON.';return;}
  const idx=new Map();
  DB.franchises.forEach(function(f){idx.set(norm(f.title),f);if(f.englishTitle)idx.set(norm(f.englishTitle),f);});
  const resolve=function(t){
    const k=norm(t);
    if(idx.has(k))return idx.get(k);
    let best=null,bestLen=0;
    DB.franchises.forEach(function(f){
      [f.title,f.englishTitle].filter(Boolean).forEach(function(nm){
        const n2=norm(nm);
        if(!n2||n2.length<6)return;
        if((k.indexOf(n2)===0||n2.indexOf(k)===0)&&n2.length>bestLen){best=f;bestLen=n2.length;}
      });
    });
    return best;
  };
  let air=0,soon=0,miss=0;
  Object.keys(d.airing||{}).forEach(function(t){
    const f=resolve(t);if(!f){miss++;return;}
    const info=d.airing[t];
    let e=airingEntry(f);
    if(!e){
      const es=ordered(f);e=es[es.length-1];
      if(!e){e={id:uid(),label:'Season 1',order:1,type:'tv',watched:0};f.entries=[e];}
    }
    e.status='airing';
    e.aired=info.episode||0;
    if(info.episodes)e.episodes=info.episodes;
    if(info.nextDate)e.nextDate=info.nextDate;
    air++;
  });
  Object.keys(d.upcoming||{}).forEach(function(t){
    const f=resolve(t);if(!f)return;
    const info=d.upcoming[t];
    if(ordered(f).some(function(e){return e.status==='announced'&&e.label===info.label;}))return;
    f.entries.push({id:uid(),label:info.label||'Next season',order:(f.entries.length+1),type:'tv',
      episodes:info.episodes||null,aired:0,status:'announced',watched:0,nextDate:info.date||''});
    f.more=true;
    soon++;
  });
  if(Array.isArray(d.discover)){
    const owned=new Set(DB.franchises.map(function(f){return norm(f.title);}));
    DB.discover=d.discover.filter(function(x){return x&&x.title&&!owned.has(norm(x.title));});
  }
  save();closeLayer();render();
  toast(`${air} airing, ${soon} sequels, ${(DB.discover||[]).length} to discover${miss?`, ${miss} unmatched`:''}`);
};
window.openArtImport=function(){
  closeLayer();
  layer(`<div class="modal" onclick="event.stopPropagation()"><h3>Import artwork links</h3>
    <p class="muted" style="font-size:12px;margin-top:0">Paste the fetch script's output — JSON, CSV, or title/url pairs.</p>
    <textarea id="artin" rows="8" placeholder='{"Log Horizon":"https://..."}'></textarea>
    <div class="row" style="margin-top:10px"><button class="btn pri" onclick="runArtImport()">Attach covers</button>
      <button class="btn" onclick="closeLayer()">Cancel</button></div>
    <div id="artout" class="muted" style="font-size:12px;margin-top:10px"></div></div>`);
};
function pairsFrom(text){
  const out=[];text=(text||'').trim();if(!text)return out;
  try{
    const j=JSON.parse(text);
    const arr=Array.isArray(j)?j:Object.keys(j).map(function(k){return {title:k,image:j[k]};});
    arr.forEach(function(o){
      if(typeof o==='string')return;
      const t=o.query||o.title||o.name||o.matched;
      const u=o.image||o.image_url||o.poster||o.cover||o.url;
      if(t&&u&&/^(https?:\/\/|images\/)/i.test(String(u)))out.push([String(t),String(u)]);
    });
    if(out.length)return out;
  }catch(e){}
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    const parts=line.split(/[,;\t]/).map(function(x){return x.trim().replace(/^"|"$/g,'');});
    const u=parts.filter(function(x){return /^(https?:\/\/|images\/)/i.test(x);})[0];
    if(u&&parts[0]&&parts[0]!==u)out.push([parts[0],u]);
  });
  return out;
}
window.runArtImport=function(){
  const pairs=pairsFrom($('artin').value);
  if(!pairs.length){$('artout').textContent='Nothing recognised.';return;}
  const idx=new Map();
  DB.franchises.forEach(function(f){idx.set(norm(f.title),f);if(f.englishTitle)idx.set(norm(f.englishTitle),f);});
  let hit=0;const missed=[];
  pairs.forEach(function(p){const f=idx.get(norm(p[0]));if(f){f.cover=p[1];hit++;}else missed.push(p[0]);});
  save();render();
  $('artout').innerHTML=`<b style="color:var(--accent)">${hit} covers attached.</b>`+(missed.length?` ${missed.length} unmatched.`:'');
};
window.openCover=function(w){
  const cur=DB.prefs.covers[w]||'';
  layer(`<div class="modal" onclick="event.stopPropagation()"><h3>Cover image</h3>
    <div class="f"><label>Paste a wide image link — blank to go automatic</label><input id="cvin" value="${esc(cur)}"></div>
    <div class="row"><button class="btn pri" onclick="saveCover('${w}')">Save</button><button class="btn" onclick="closeLayer()">Cancel</button></div></div>`);
};
window.saveCover=function(w){const v=($('cvin').value||'').trim();
  if(v)DB.prefs.covers[w]=v;else delete DB.prefs.covers[w];save();closeLayer();render();};

/* ---------- edit franchise ---------- */
window.openEdit=function(id){
  const f=id?find(id):{id:null,title:'',genres:[],entries:[]};
  layer(`<div class="sheet" onclick="event.stopPropagation()">
    <div class="row"><h3 style="flex:1">${id?'Edit':'Add show'}</h3>${id?`<button class="btn sm" onclick="delShow('${id}')">Delete</button>`:''}<button class="btn sm" onclick="closeLayer()">Close</button></div>
    <div class="f"><label>Title</label><input id="e_title" value="${esc(f.title)}"></div>
    <div class="f"><label>English title</label><input id="e_en" value="${esc(f.englishTitle)}"></div>
    <div class="f2"><div class="f"><label>Studio</label><input id="e_studio" value="${esc(f.studio)}"></div>
      <div class="f"><label>Year</label><input id="e_year" type="number" value="${f.year||''}"></div></div>
    <div class="f2"><div class="f"><label>Community score</label><input id="e_score" type="number" step="0.1" value="${f.score!=null?f.score:''}"></div>
      <div class="f"><label>Intent</label><select id="e_intent">${INTENT.map(i=>`<option value="${i[0]}" ${(f.intent||'')===i[0]?'selected':''}>${i[1]}</option>`).join('')}</select></div></div>
    <div class="f"><label>Genres</label><div class="tags" id="e_cats">${CATS.map(c=>`<button class="tag" aria-pressed="${(f.genres||[]).indexOf(c)>=0}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')==='true'?'false':'true')">${c}</button>`).join('')}</div></div>
    <div class="box"><h4>ARTWORK</h4>
      <div class="f"><label>Wide banner link</label><input id="e_banner" value="${esc(f.banner)}"></div>
      <div class="f"><label>Poster link</label><input id="e_cover" value="${esc(f.cover)}"></div></div>
    <div class="f"><label>Notes</label><textarea id="e_notes" rows="3">${esc(f.notes)}</textarea></div>
    <button class="btn pri" style="width:100%;padding:12px" onclick="saveEdit('${id||''}')">Save</button></div>`);
};
window.saveEdit=function(id){
  const g=i=>$(i).value.trim(),n=i=>$(i).value===''?null:Number($(i).value);
  if(!g('e_title'))return toast('Needs a title');
  const cats=[].slice.call($('e_cats').querySelectorAll('[aria-pressed="true"]')).map(function(b){return b.textContent;});
  let f=id?find(id):null;
  if(!f){f={id:uid(),rewatches:0,entries:[{id:uid(),label:'Season 1',order:1,type:'tv',episodes:null,aired:0,status:'finished',watched:0,nextDate:''}]};DB.franchises.push(f);}
  Object.assign(f,{title:g('e_title'),englishTitle:g('e_en'),studio:g('e_studio'),year:n('e_year'),
    score:n('e_score'),intent:$('e_intent').value,genres:cats,banner:g('e_banner'),cover:g('e_cover'),notes:g('e_notes')});
  save();closeLayer();render();toast('Saved');
};
window.delShow=function(id){
  DB.franchises=DB.franchises.filter(f=>f.id!==id);
  DB.lists.forEach(l=>{l.items=l.items.filter(x=>x!==id);});
  save();closeLayer();ENT=null;TAB=(TABBACK==='entity'?'dash':TABBACK);render();
};

/* ---------- layer + theme ---------- */
function layer(h){$('layer').innerHTML=`<div class="scrim" onclick="closeLayer()"></div>`+h;}
window.closeLayer=function(){$('layer').innerHTML='';};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLayer();});
window.openThemes=function(){
  const T=[['crt','Old computer'],['night','Night'],['kids','Kids'],['soft','Soft dark']];
  layer(`<div class="modal" onclick="event.stopPropagation()"><h3>Theme</h3><div class="tags" style="margin-bottom:14px">${T.map(t=>`<button class="tag" aria-pressed="${DB.prefs.theme===t[0]}" onclick="setTheme('${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div class="f"><label>Accent</label><input type="color" value="${DB.prefs.accents[DB.prefs.theme]||'#35ff86'}" onchange="setAccent(this.value)" style="height:42px;padding:3px"></div>
    <div class="row"><button class="btn" onclick="setAccent('')">Reset accent</button><span class="spacer"></span><button class="btn pri" onclick="closeLayer()">Done</button></div></div>`);
};
window.setTheme=function(t){DB.prefs.theme=t;save();applyTheme();openThemes();};
window.setAccent=function(v){if(v)DB.prefs.accents[DB.prefs.theme]=v;else delete DB.prefs.accents[DB.prefs.theme];save();applyTheme();};
function applyTheme(){
  const el=$('app');el.setAttribute('data-theme',DB.prefs.theme||'crt');
  const a=DB.prefs.accents[DB.prefs.theme];if(a)el.style.setProperty('--accent',a);else el.style.removeProperty('--accent');
  $('sub').textContent=(DB.prefs.theme==='crt'?'READY.':'anime watch ledger')+'  '+VER;
}
loadCloud();
load().then(function(){applyTheme();render();autoSync();if(signedIn())cloudPull(true);});
})();
